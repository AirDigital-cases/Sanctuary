    <script>
      ;(function (location) {
        if (!location.search.startsWith('?/')) {
          return
        }

        const decoded = location.search
          .slice(2)
          .split('&')
          .map((segment) => segment.replace(/~and~/g, '&'))
          .join('?')

        const basePath = '/Sanctuary'
        const normalizedPath = decoded.startsWith('/') ? decoded : `/${decoded}`
        const nextUrl = `${basePath}${normalizedPath}${location.hash}`

        window.history.replaceState(null, '', nextUrl)
      })(window.location)
    </script>
